    <script>
      (function () {
        function init() {
          var map = document.getElementById('map');
          if (!map) {
            requestAnimationFrame(init);
            return;
          }
          if (!map.style.position) map.style.position = 'relative';

          function showFallback() {
            if (document.getElementById('map-fallback-msg')) return;
            var msg = document.createElement('div');
            msg.id = 'map-fallback-msg';
            msg.innerHTML = 'The map couldn\'t load in this browser. Try a different browser, or <a href="stores.json" target="_blank" rel="noopener">view the store list</a>.';
            map.appendChild(msg);
          }

          var supported = true;
          try {
            supported = !window.mapboxgl || typeof window.mapboxgl.supported !== 'function' || window.mapboxgl.supported();
          } catch (e) {
            supported = false;
          }
          if (!supported) {
            showFallback();
            return;
          }

          setTimeout(function () {
            var canvas = map.querySelector('canvas');
            var hasWebGL = false;
            if (canvas) {
              try {
                hasWebGL = !!(canvas.getContext('webgl') || canvas.getContext('webgl2') || canvas.getContext('experimental-webgl'));
              } catch (e) {}
            }
            if (!hasWebGL) showFallback();
          }, 8000);
        }
        init();
      })();
