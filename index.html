    <style>
      #vinyl-map-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:5;border-radius:50%;overflow:hidden;background:#000;transition:opacity .6s ease;}
      #vinyl-map-overlay.vinyl-map-overlay--hidden{opacity:0;pointer-events:none;}
      #vinyl-map-overlay video{display:block;width:100%;height:100%;object-fit:cover;}
    </style>
    <script>
      (function () {
        function init() {
          var map = document.getElementById('map');
          if (!map) {
            requestAnimationFrame(init);
            return;
          }
          if (!map.style.position) map.style.position = 'relative';

          function mapIsReady() {
            var canvas = map.querySelector('canvas');
            if (!canvas) return false;
            try {
              return !!(canvas.getContext('webgl') || canvas.getContext('webgl2') || canvas.getContext('experimental-webgl'));
            } catch (e) {
              return false;
            }
          }

          var overlay = document.createElement('div');
          overlay.id = 'vinyl-map-overlay';
          overlay.innerHTML =
            '<video autoplay muted playsinline preload="auto" poster="img/vinyl-loading-poster.jpg">' +
            '<source src="vid/vinyl-loading-blk.mp4" type="video/mp4">' +
            '</video>';
          map.appendChild(overlay);

          var video = overlay.querySelector('video');
          var hidden = false;
          function hideOverlay() {
            if (hidden) return;
            hidden = true;
            overlay.classList.add('vinyl-map-overlay--hidden');
            setTimeout(function () {
              if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
            }, 650);
          }

          function onVideoCycleEnd() {
            if (mapIsReady()) {
              hideOverlay();
            } else {
              video.currentTime = 0;
              video.play();
            }
          }

          video.addEventListener('ended', onVideoCycleEnd);
          video.addEventListener('error', hideOverlay);
          overlay.addEventListener('click', onVideoCycleEnd);
          setTimeout(onVideoCycleEnd, 9000);
        }
        init();
      })();
    </script>
